{% extends "base.html" %}
{% block hero %}
<section class="hero">
  <div class="hero-media">
    <img src="{{ url_for('static', filename='img/hero-1148.webp') }}"
         srcset="{{ url_for('static', filename='img/hero-574.webp') }} 574w, {{ url_for('static', filename='img/hero-1148.webp') }} 1148w"
         sizes="100vw" alt="" width="1148" height="623" fetchpriority="high">
  </div>
  <div class="container hero-inner">
    <h1 class="rise" style="--d: 0">Got two left feet, we'll put one right!</h1>
  </div>
</section>
{% endblock %}
{% block content %}
<div class="album-list">
  {% for a in albums %}{% include "gallery/_album_card.html" %}{% endfor %}
</div>
{% endblock %}
