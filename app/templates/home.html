{% extends "base.html" %}
{% block hero %}
<section class="hero">
  <div class="hero-media">
    <img src="{{ url_for('static', filename='img/tent-1440.webp') }}"
         srcset="{{ url_for('static', filename='img/tent-720.webp') }} 720w, {{ url_for('static', filename='img/tent-1440.webp') }} 1440w"
         sizes="100vw" alt="" width="1440" height="1080" fetchpriority="high">
  </div>
  <div class="container hero-inner">
    <h1 class="rise" style="--d: 0">Got two left feet, we'll put one right!</h1>
  </div>
</section>
{% endblock %}
{% block content %}
<div class="album-list">
  {% for a in albums %}{% include "gallery/_album_card.html" %}{% endfor %}
</div>
{% endblock %}
