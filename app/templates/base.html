<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UCT Ballroom and Latin Dancing Society{% endblock %}</title>
  <meta name="description" content="{% block description %}UCT Ballroom: the university ballroom and Latin dance society.{% endblock %}">
  <meta name="theme-color" content="#0a1128">
  <link rel="icon" href="{{ asset('img/favicon-32.png') }}" type="image/png" sizes="32x32">
  <link rel="icon" href="{{ asset('img/icon-192.png') }}" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ asset('img/apple-touch-icon.png') }}">
  <link rel="preload" href="{{ asset('fonts/dm-sans-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ asset('fonts/bevan-latin-400-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ asset('css/site.css') }}">
  <script src="{{ asset('vendor/htmx.min.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('pages.home') }}" aria-label="UCT Ballroom and Latin Dancing Society home">{% include "_logo.html" %}</a>
    </div>
  </header>
  <main id="main">
    {% block hero %}{% endblock %}
    {% block full %}{% endblock %}
    <div class="container page">{% block content %}{% endblock %}</div>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <p class="muted">&copy; {{ current_year }} UCT Ballroom and Latin Dancing Society</p>
      </div>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
