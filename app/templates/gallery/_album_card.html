<a class="album-card" href="{{ url_for('gallery.album', slug=a.slug) }}"{% if g.admin %} draggable="true" data-slug="{{ a.slug }}"{% endif %}>
  <div class="cover{% if a.cover_fit == 'full' and a.cover %} cover--full{% endif %}"
       style="--x: {{ a.cover_x }}%; --y: {{ a.cover_y }}%;{% if a.cover %} --ar: {{ '%.4f' % (a.cover.width / a.cover.height) }}; background-image: url('{{ a.cover.placeholder }}'){% endif %}">
    {% if a.cover %}<img src="{{ photo_url(a.cover, best_width(a.cover, 800)) }}" loading="lazy"
         width="{{ a.cover.width }}" height="{{ a.cover.height }}" alt="" draggable="false">{% endif %}
  </div>
  <h3>{{ a.title }}</h3>
  <p class="muted">{{ a.photo_count }} photo{{ '' if a.photo_count == 1 else 's' }}</p>
</a>
