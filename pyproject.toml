[project]
name = "uct-ballroom"
version = "0.1.0"
description = "UCT Ballroom society website"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.44.3",
    "flask>=3.0",
    "gunicorn>=27.0.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
